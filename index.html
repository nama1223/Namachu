<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=450">
  <title>NamaChu</title>
  <script>
    const userLang = navigator.language || navigator.userLanguage;
    const isJapanese = userLang.startsWith('ja');
    document.documentElement.lang = isJapanese ? 'ja' : 'en';
  </script>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/tabs.css">
  <link rel="stylesheet" href="css/tuner.css">
  <link rel="stylesheet" href="css/record.css">
  <link rel="stylesheet" href="css/scale.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body>

<div id="toastMsg"></div>

<div class="lang-selector-outer">
  <button class="lang-btn" id="langJa" onclick="setLang('ja')">日本語</button>
  <button class="lang-btn" id="langEn" onclick="setLang('en')">English</button>
  <span id="appSubtitle" style="font-size:0.75rem;opacity:0.6;margin-left:auto;"></span>
</div>

<div class="app-tabs">
  <button class="tab-btn active" id="tabBtn-tuner" onclick="switchTab('tuner')" data-i18n="tab_tuner">チューナー</button>
  <button class="tab-btn" id="tabBtn-record" onclick="switchTab('record')" data-i18n="tab_record">記録</button>
  <button class="tab-btn" id="tabBtn-scale" onclick="switchTab('scale')" data-i18n="tab_scale">音階測定</button>
  <button class="tab-btn" id="tabBtn-settings" onclick="switchTab('settings')" data-i18n="tab_settings">設定</button>
</div>

<div class="container">

  <!-- ===== チューナータブ ===== -->
  <div id="tab-tuner" class="tab-content active">
    <div class="header-row">
      <h1 id="appTitle">NamaChu</h1>
      <button class="mic-btn" id="micToggleBtn" onclick="toggleMic()">🎤</button>
    </div>

    <!-- 上半分: アナログメーター -->
    <div class="tuner-upper">
      <div class="meter-wrapper">
        <svg class="meter-svg" viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
          <!-- 目盛り弧 -->
          <path class="meter-arc" d="M 20 150 A 130 130 0 0 1 280 150" fill="none" stroke-width="3"/>
          <!-- 目盛り線 -->
          <g class="meter-ticks" id="meterTicks"></g>
          <!-- 針 -->
          <line class="meter-needle" id="meterNeedle" x1="150" y1="150" x2="150" y2="30"/>
          <!-- 中心点 -->
          <circle class="meter-pivot" cx="150" cy="150" r="7"/>
        </svg>
        <div class="meter-labels">
          <span>-50</span>
          <span>-25</span>
          <span>0</span>
          <span>+25</span>
          <span>+50</span>
        </div>
      </div>

      <div class="note-display">
        <div class="note-name" id="noteName">--</div>
        <div class="note-octave" id="noteOctave"></div>
        <div class="note-cents" id="noteCents">±0 ¢</div>
        <div class="note-freq" id="noteFreq">-- Hz</div>
      </div>
    </div>

    <!-- 下半分: 時間軸グラフ -->
    <div class="tuner-lower">
      <canvas class="time-graph" id="timeGraph"></canvas>
      <div class="time-graph-labels">
        <span>+50¢</span>
        <span>0</span>
        <span>-50¢</span>
      </div>
    </div>

    <div class="tuner-footer">
      <span class="instrument-badge" id="instrumentBadge" onclick="switchTab('settings')"></span>
      <span class="concert-pitch-badge" id="concertPitchBadge">A = 440 Hz</span>
    </div>
  </div>

  <!-- ===== 記録タブ ===== -->
  <div id="tab-record" class="tab-content">
    <div class="header-row">
      <h1 data-i18n="tab_record">記録</h1>
      <div class="record-header-btns">
        <button class="icon-btn" id="saveRecordBtn" onclick="saveRecording()" title="保存">💾</button>
        <button class="icon-btn" id="loadRecordBtn" onclick="showRecordList()" title="読み込み">📂</button>
      </div>
    </div>

    <!-- カラオケ式スコール表示 -->
    <div class="record-view-wrapper">
      <canvas class="record-canvas" id="recordCanvas"></canvas>
      <div class="record-pitch-axis" id="recordPitchAxis"></div>
    </div>

    <!-- 再生位置バー -->
    <div class="record-time-bar">
      <span id="recordTimeCurrent">0:00</span>
      <div class="record-progress-track">
        <div class="record-progress-fill" id="recordProgressFill"></div>
      </div>
      <span id="recordTimeTotal">0:00</span>
    </div>

    <!-- コントロール -->
    <div class="record-controls">
      <button class="rec-btn" id="recBtn" onclick="toggleRecording()">⏺ <span data-i18n="btn_record">録音</span></button>
      <button class="play-btn" id="playBackBtn" onclick="togglePlayback()" disabled>▶ <span data-i18n="btn_play">再生</span></button>
      <button class="clear-btn" id="clearRecBtn" onclick="clearRecording()">✕</button>
    </div>

    <!-- 保存リストモーダル -->
    <div class="record-list-overlay" id="recordListOverlay" onclick="if(event.target===this)hideRecordList()">
      <div class="record-list-modal">
        <h3 data-i18n="label_saved_records">保存済み記録</h3>
        <div id="recordListItems"></div>
        <button onclick="hideRecordList()" data-i18n="btn_close">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ===== 音階測定タブ ===== -->
  <div id="tab-scale" class="tab-content">
    <div class="header-row">
      <h1 data-i18n="tab_scale">音階測定</h1>
      <button class="icon-btn" id="scaleHelpBtn" onclick="showScaleHelp()">?</button>
    </div>

    <div class="scale-instrument-row">
      <label data-i18n="label_instrument">楽器</label>
      <select id="scaleMeasureInstrument" onchange="onScaleInstrumentChange()"></select>
    </div>

    <!-- チューニング確認 -->
    <div class="scale-tuning-section">
      <p class="scale-hint" data-i18n="hint_scale_tuning">まずA4（または楽器の基準音）でチューニングしてください</p>
      <div class="scale-tuning-meter">
        <div class="scale-ref-note" id="scaleRefNote">A4</div>
        <div class="scale-tuning-cents" id="scaleTuningCents">-- ¢</div>
      </div>
    </div>

    <!-- 測定コントロール -->
    <div class="scale-controls">
      <button class="scale-start-btn" id="scaleStartBtn" onclick="toggleScaleMeasure()">
        <span data-i18n="btn_scale_start">スタート</span>
      </button>
      <button class="scale-clear-btn" onclick="clearScaleData()">
        <span data-i18n="btn_scale_clear">クリア</span>
      </button>
    </div>

    <!-- 現在測定中の音 -->
    <div class="scale-current" id="scaleCurrentSection" style="display:none">
      <div class="scale-current-note" id="scaleCurrentNote">--</div>
      <div class="scale-shot-dots" id="scaleShotDots">
        <span class="shot-dot" id="shot0"></span>
        <span class="shot-dot" id="shot1"></span>
        <span class="shot-dot" id="shot2"></span>
      </div>
      <div class="scale-current-cents" id="scaleCurrentCents">-- ¢</div>
    </div>

    <!-- 測定結果グラフ -->
    <div class="scale-chart-wrapper">
      <canvas class="scale-chart" id="scaleChart"></canvas>
    </div>

    <!-- 比較リスト（複数楽器） -->
    <div class="scale-compare-section" id="scaleCompareSection">
      <div class="scale-compare-header">
        <span data-i18n="label_compare">比較</span>
        <button class="scale-export-btn" onclick="exportScaleData()" data-i18n="btn_export">エクスポート</button>
      </div>
      <div id="scaleDataList"></div>
    </div>
  </div>

  <!-- ===== 設定タブ ===== -->
  <div id="tab-settings" class="tab-content">
    <div class="header-row">
      <h1 data-i18n="tab_settings">設定</h1>
    </div>

    <!-- 楽器 -->
    <div class="setting-card">
      <div class="setting-card-title" data-i18n="label_instrument">楽器</div>
      <select id="instrumentSelect" onchange="onInstrumentChange()"></select>
      <div class="setting-row" style="margin-top:8px;">
        <label data-i18n="label_transposition">移調</label>
        <span id="transpositionLabel" class="setting-value-badge"></span>
      </div>
      <div class="setting-row">
        <label data-i18n="label_range">音域</label>
        <span id="rangeLabel" class="setting-value-badge"></span>
      </div>
    </div>

    <!-- ピッチ基準 -->
    <div class="setting-card">
      <div class="setting-card-title" data-i18n="label_concert_pitch">コンサートピッチ</div>
      <div class="stepper-ui">
        <button onclick="adjustConcertPitch(-1)">−</button>
        <span id="concertPitchVal">440</span>
        <button onclick="adjustConcertPitch(+1)">＋</button>
      </div>
      <div style="text-align:center;font-size:0.75rem;opacity:0.6;margin-top:4px;">Hz (A4)</div>
    </div>

    <!-- 表示音名 -->
    <div class="setting-card">
      <div class="setting-card-title" data-i18n="label_note_name_style">音名表記</div>
      <div class="options-row">
        <label><input type="radio" name="noteStyle" value="abc" onchange="onNoteStyleChange()"> C D E...</label>
        <label><input type="radio" name="noteStyle" value="do" onchange="onNoteStyleChange()"> ド レ ミ...</label>
      </div>
    </div>

    <!-- テーマ -->
    <div class="setting-card">
      <div class="setting-card-title" data-i18n="label_theme">テーマ</div>
      <div class="theme-grid" id="themeGrid"></div>
    </div>

    <!-- マイク感度 -->
    <div class="setting-card">
      <div class="setting-card-title" data-i18n="label_mic_sensitivity">マイク感度 / 閾値</div>
      <div class="setting-row">
        <label data-i18n="label_min_volume">最小音量</label>
        <input type="range" id="minVolumeSlider" min="0" max="100" value="10" oninput="onMinVolumeChange()">
        <span id="minVolumeVal">10</span>
      </div>
      <div class="setting-row">
        <label data-i18n="label_clarity">クラリティ閾値</label>
        <input type="range" id="claritySlider" min="0" max="100" value="85" oninput="onClarityChange()">
        <span id="clarityVal">85</span>
      </div>
    </div>

    <!-- データ管理 -->
    <div class="setting-card">
      <div class="setting-card-title" data-i18n="label_data">データ管理</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="setting-action-btn" onclick="exportAllData()" data-i18n="btn_export_all">全データ出力</button>
        <button class="setting-action-btn" onclick="importData()" data-i18n="btn_import">インポート</button>
        <button class="setting-action-btn danger" onclick="clearAllData()" data-i18n="btn_clear_all">全消去</button>
      </div>
    </div>

    <div class="ad-spacer"></div>
  </div>

</div><!-- /.container -->

<!-- ===== ヘルプモーダル（音階測定） ===== -->
<div class="modal-overlay" id="scaleHelpModal" onclick="if(event.target===this)closeModal('scaleHelpModal')">
  <div class="modal-content">
    <h2 data-i18n="help_scale_title">音階測定とは</h2>
    <p data-i18n="help_scale_body">楽器固有の音程の癖を記録します。各音を3回吹くと平均値を記録します。吹き始めと吹き終わりは除外されます。</p>
    <div class="modal-buttons">
      <button onclick="closeModal('scaleHelpModal')" data-i18n="btn_close">閉じる</button>
    </div>
  </div>
</div>

<!-- ===== 保存名入力モーダル ===== -->
<div class="modal-overlay" id="saveNameModal" onclick="if(event.target===this)closeModal('saveNameModal')">
  <div class="modal-content">
    <h2 data-i18n="label_save_name">保存名</h2>
    <input type="text" id="saveNameInput" style="width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--dot-weak);border-radius:8px;background:var(--surface-color);color:var(--text-color);font-size:1rem;">
    <div class="modal-buttons">
      <button class="btn-save" onclick="confirmSaveRecording()" data-i18n="btn_save">保存</button>
      <button onclick="closeModal('saveNameModal')" data-i18n="btn_cancel">キャンセル</button>
    </div>
  </div>
</div>

<div class="ad-spacer"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
